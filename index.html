<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Macro Dashboard</title>
<style>
  :root {
    --bg: #f7f8fa; --card: #ffffff; --border: #e2e6eb; --border2: #eef1f4;
    --text: #1c2430; --muted: #5d6b7a; --dim: #93a0ad;
    --green: #2e9e6b; --green-lt: #257f56; --orange: #d9663d;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Avenir Next','Segoe UI',system-ui,sans-serif; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 24px 16px; }
  .eyebrow { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--green); font-weight: 700; margin-bottom: 4px; }
  h1 { font-size: 26px; margin: 0 0 20px; font-weight: 700; }
  .row { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
  .row.nowrap { flex-wrap: nowrap; }
  .row.nowrap .pill { flex: 1; padding: 6px 0; text-align: center; min-width: 0; }
  .pill { padding: 6px 12px; border-radius: 6px; border: 1px solid var(--border); background: transparent; color: var(--muted); font-size: 13px; font-weight: 600; cursor: pointer; }
  .pill.on { border-color: var(--green); background: rgba(46,158,107,.1); color: var(--green-lt); }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 18px; margin-bottom: 16px; box-shadow: 0 1px 3px rgba(16,24,40,0.05); }
  .bar-label { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 4px; }
  .bar-label .name { color: var(--muted); letter-spacing: .06em; text-transform: uppercase; font-weight: 600; }
  .bar-track { height: 8px; background: var(--border2); border-radius: 4px; overflow: hidden; margin-bottom: 14px; }
  .bar-fill { height: 100%; border-radius: 4px; transition: width .4s ease; background: var(--green); }
  .bar-fill.over { background: var(--orange); }
  .num { font-variant-numeric: tabular-nums; }
  input, select { width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border); background: #ffffff; color: var(--text); font-size: 14px; outline: none; }
  input:focus, select:focus { border-color: var(--green); }
  .flex { display: flex; gap: 8px; }
  .flex > * { flex: 1; }
  .section-title { font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 12px; }
  .dropdown { position: absolute; top: 100%; left: 0; right: 0; background: #ffffff; border: 1px solid var(--border); border-radius: 8px; margin-top: 4px; z-index: 10; overflow: hidden; box-shadow: 0 4px 12px rgba(16,24,40,0.1); }
  .dropdown div { padding: 10px 12px; cursor: pointer; font-size: 14px; border-bottom: 1px solid var(--border); }
  .dropdown div:hover { background: #f2f5f8; }
  .dropdown span { color: var(--dim); font-size: 12px; margin-left: 8px; }
  .preview { font-size: 13px; color: var(--green-lt); margin: 10px 0; }
  .add-btn { width: 100%; padding: 10px 0; border-radius: 8px; border: none; background: var(--green); color: #ffffff; font-weight: 700; font-size: 14px; cursor: pointer; }
  .add-btn:disabled { background: #e8ecf0; color: var(--dim); cursor: default; }
  .ghost-btn { padding: 10px 14px; border-radius: 8px; border: 1px solid var(--border); background: transparent; color: var(--muted); font-weight: 600; font-size: 13px; cursor: pointer; white-space: nowrap; }
  .ghost-btn.on { border-color: var(--green); color: var(--green-lt); }
  .save-food-btn { width: 100%; padding: 10px 0; border-radius: 8px; border: 1px solid var(--green); background: transparent; color: var(--green-lt); font-weight: 700; font-size: 14px; cursor: pointer; }
  .meal-head { display: flex; justify-content: space-between; margin-bottom: 10px; }
  .meal-head .t { font-weight: 700; font-size: 14px; }
  .meal-head .s { font-size: 12px; color: var(--muted); }
  .entry { display: flex; justify-content: space-between; align-items: center; padding: 7px 0; border-top: 1px solid var(--border2); font-size: 13px; }
  .entry .amt { color: var(--dim); }
  .entry .macros { display: flex; align-items: center; gap: 10px; color: var(--muted); }
  .entry button { background: none; border: none; color: var(--orange); cursor: pointer; font-size: 15px; padding: 0; }
  .empty { text-align: center; color: var(--dim); font-size: 14px; padding: 30px 0; }
  .mt { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--border); }
  .mb8 { margin-bottom: 8px; }
  .mb10 { margin-bottom: 10px; }
  .rel { position: relative; }
</style>
</head>
<body>

  { name: "Spinach (raw)", mode: "unit", base: 1, unitLabel: "cup", cal: 7, p: 0.9, c: 1, f: 0 },
  { name: "Tomato", mode: "g", base: 150, cal: 27, p: 1, c: 6, f: 0 },

  { name: "Baby Carrots", mode: "g", base: 100, cal: 41, p: 1, c: 10, f: 0 },
  { name: "Edamame (shelled)", mode: "unit", base: 1, unitLabel: "1/2 cup", cal: 95, p: 8, c: 8, f: 4 },
  { name: "Seaweed Snack Pack", mode: "unit", base: 1, unitLabel: "pack", cal: 30, p: 1, c: 1, f: 2 },
  { name: "Cappuccino (almond milk)", mode: "unit", base: 1, unitLabel: "cup", cal: 15, p: 1, c: 1, f: 1 },
  { name: "Spindrift", mode: "unit", base: 1, unitLabel: "can", cal: 17, p: 0, c: 4, f: 0 },
  { name: "Almond Milk (unsweetened)", mode: "unit", base: 1, unitLabel: "cup", cal: 30, p: 1, c: 1, f: 2.5 },
  { name: "Epic Pork Rinds", mode: "g", base: 14, cal: 80, p: 8, c: 0.5, f: 5 },
  { name: "Hu Salty Dark Chocolate Bar", mode: "g", base: 30, cal: 190, p: 3, c: 14, f: 14 },
  { name: "Hu Dark Chocolate (square)", mode: "g", base: 30, cal: 95, p: 1.5, c: 7, f: 7 },
  { name: "Tony's Chocolate", mode: "g", base: 10, cal: 50, p: 1, c: 5, f: 3 },
  { name: "Dubai Chocolate", mode: "g", base: 25, cal: 130, p: 2, c: 12, f: 8 },
  { name: "Red Wine (5oz)", mode: "unit", base: 1, unitLabel: "glass", cal: 125, p: 0, c: 4, f: 0 },
];

const TARGETS = {
  training: { cal: 2150, p: 195, c: 203, f: 62 },
  rest: { cal: 1900, p: 195, c: 140, f: 62 },
};
const DAYS = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
const MEALS = ["Breakfast","Lunch","Snack","Dinner","Dessert"];
const r1 = n => Math.round(n*10)/10;

// localStorage persistence (works on GitHub Pages)
const loadLS = (k, fb) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : fb; } catch(e){ return fb; } };
const saveLS = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} };

function Bar({ label, val, max, unit }) {
  const pct = Math.min((val/max)*100, 100);
  const over = val > max;
  const rem = r1(max - val);
  return h("div", null,
    h("div", { className: "bar-label" },
      h("span", { className: "name" }, label),
      h("span", { className: "num", style: { color: over ? "var(--orange)" : "var(--text)" } },
        `${r1(val)} / ${max}${unit} `,
        h("span", { style: { color: "var(--dim)" } }, rem >= 0 ? `(${rem} left)` : `(${Math.abs(rem)} over)`)
      )
    ),
    h("div", { className: "bar-track" },
      h("div", { className: "bar-fill" + (over ? " over" : ""), style: { width: pct + "%" } })
    )
  );
}

function App() {
  const [week, setWeek] = useState(loadLS("md-week", 1));
  const [day, setDay] = useState(loadLS("md-day", "Mon"));
  const [foods, setFoods] = useState(() => [...SEED_FOODS, ...loadLS("md-custom-foods", [])]);
  const [log, setLog] = useState(() => loadLS("md-log", {}));
  const [query, setQuery] = useState("");
  const [sel, setSel] = useState(null);
  const [amount, setAmount] = useState("");
  const [meal, setMeal] = useState("Breakfast");
  const [showNew, setShowNew] = useState(false);
  const [nf, setNf] = useState({ name:"", mode:"g", base:"100", unitLabel:"serving", cal:"", p:"", c:"", f:"" });
  const [usdaResults, setUsdaResults] = useState([]);
  const [usdaLoading, setUsdaLoading] = useState(false);
  const [usdaError, setUsdaError] = useState("");

  const fetchUSDA = async (q) => {
    const res = await fetch(`https://api.nal.usda.gov/fdc/v1/foods/search?api_key=DEMO_KEY&query=${encodeURIComponent(q)}&pageSize=6&dataType=Foundation,SR%20Legacy,Branded`);
    if (!res.ok) throw new Error("USDA " + res.status);
    const data = await res.json();
    return (data.foods || []).map(f => {
      const get = (ids) => {
        const n = (f.foodNutrients || []).find(n => ids.includes(n.nutrientId) || ids.includes(n.nutrientNumber));
        return n ? n.value : 0;
      };
      return {
        name: f.description + (f.brandOwner ? " (" + f.brandOwner + ")" : ""),
        mode: "g", base: 100,
        cal: Math.round(get([1008, "208"])),
        p: Math.round(get([1003, "203"]) * 10) / 10,
        c: Math.round(get([1005, "205"]) * 10) / 10,
        f: Math.round(get([1004, "204"]) * 10) / 10,
        source: "USDA",
      };
    }).filter(f => f.cal > 0);
  };

  const fetchOFF = async (q) => {
    const res = await fetch(`https://world.openfoodfacts.org/cgi/search.pl?search_terms=${encodeURIComponent(q)}&search_simple=1&action=process&json=1&page_size=6&fields=product_name,brands,nutriments`);
    if (!res.ok) throw new Error("OFF " + res.status);
    const data = await res.json();
    return (data.products || []).map(p => {
      const n = p.nutriments || {};
      return {
        name: (p.product_name || "Unknown") + (p.brands ? " (" + p.brands.split(",")[0] + ")" : ""),
        mode: "g", base: 100,
        cal: Math.round(n["energy-kcal_100g"] || 0),
        p: Math.round((n.proteins_100g || 0) * 10) / 10,
        c: Math.round((n.carbohydrates_100g || 0) * 10) / 10,
        f: Math.round((n.fat_100g || 0) * 10) / 10,
        source: "OFF",
      };
    }).filter(f => f.cal > 0);
  };

  const searchUSDA = async () => {
    if (!query.trim()) return;
    setUsdaLoading(true); setUsdaError(""); setUsdaResults([]);
    let results = [];
    let usdaFailed = false;
    try { results = await fetchUSDA(query); } catch (e) { usdaFailed = true; }
    if (!results.length) {
      try {
        const off = await fetchOFF(query);
        results = off;
        if (!off.length) setUsdaError(usdaFailed ? "Both USDA and Open Food Facts lookups failed." : "No matches in USDA or Open Food Facts.");
      } catch (e) {
        setUsdaError(usdaFailed ? "Both lookups failed — network or rate limit." : "No USDA matches; Open Food Facts lookup failed.");
      }
    }
    setUsdaResults(results);
    setUsdaLoading(false);
  };

  const pickUsda = (m) => {
    setSel(m); setQuery(m.name); setUsdaResults([]);
    const all = [...foods, { ...m, custom: true }];
    setFoods(all);
    saveLS("md-custom-foods", all.filter(f=>f.custom));
  };

  const [suggestions, setSuggestions] = useState(null);

  // Infer food role from macro profile
  const roleOf = (f) => {
    const calPer = f.cal / (f.mode === "g" ? f.base / 100 : 1); // rough density
    const pCal = f.p * 4, cCal = f.c * 4, fCal = f.f * 9;
    const tot = Math.max(pCal + cCal + fCal, 1);
    if (f.mode === "g" && f.cal / f.base <= 0.5) return "veg"; // <50 cal/100g
    if (pCal / tot >= 0.5) return "protein";
    if (fCal / tot >= 0.5) return "fat";
    if (cCal / tot >= 0.55) return "carb";
    return "mixed";
  };

  const scoreLeft = (left) => {
    const pen = (v, w) => (v < 0 ? 3 * Math.abs(v) : v) * w;
    return pen(left.cal, 1/50) + pen(left.p, 1/4) + pen(left.c, 1/5) + pen(left.f, 1/2.5);
  };

  const bestPortion = (food, rem, calCap) => {
    let best = null;
    const scales = [];
    if (food.mode === "g") { for (let g = 10; g <= 450; g += 5) scales.push(g / food.base); }
    else { for (let u = 0.25; u <= 4.001; u += 0.25) scales.push(u / food.base); }
    for (const s of scales) {
      const c = { cal: food.cal*s, p: food.p*s, c: food.c*s, f: food.f*s };
      if (c.cal > calCap) continue;
      const left = { cal: rem.cal-c.cal, p: rem.p-c.p, c: rem.c-c.c, f: rem.f-c.f };
      const sc = scoreLeft(left);
      if (!best || sc < best.sc) best = { sc, s, contrib: c };
    }
    return best;
  };

  const fmtAmt = (food, s) => food.mode === "g" ? Math.round(s*food.base) + "g" : (Math.round(s*food.base*4)/4) + " " + food.unitLabel;

  const suggestFillers = () => {
    const rem = {
      cal: target.cal - totals.cal,
      p: target.p - totals.p,
      c: target.c - totals.c,
      f: target.f - totals.f,
    };
    if (rem.cal <= 50) { setSuggestions({ singles: [], combos: [] }); return; }

    // ---- Singles ----
    const singles = [];
    for (const food of foods) {
      const b = bestPortion(food, rem, rem.cal + 60);
      if (b) singles.push({ food, ...b });
    }
    singles.sort((a,b) => a.sc - b.sc);
    const topSingles = singles.slice(0, 4).map(r => ({
      items: [{ name: r.food.name, amt: fmtAmt(r.food, r.s), foodRef: r.food, amount: r.food.mode==="g"?Math.round(r.s*r.food.base):Math.round(r.s*r.food.base*4)/4 }],
      cal: r1(r.contrib.cal), p: r1(r.contrib.p), c: r1(r.contrib.c), f: r1(r.contrib.f),
    }));

    // ---- Combos (meal-sized gaps only) ----
    let combos = [];
    if (rem.cal >= 400) {
      const proteins = foods.filter(f => roleOf(f) === "protein").slice(0, 14);
      const carbs = foods.filter(f => roleOf(f) === "carb").slice(0, 10);
      const vegsFats = foods.filter(f => { const r = roleOf(f); return r === "veg" || r === "fat"; }).slice(0, 12);
      const comboResults = [];
      for (const P of proteins) for (const C of carbs) for (const V of vegsFats) {
        // Sequential greedy portioning: protein first vs P gap, then carb vs C gap, then veg/fat vs remainder
        let working = { ...rem };
        const bp = bestPortion(P, { cal: working.cal, p: working.p, c: 0, f: 0 }, working.cal * 0.65);
        if (!bp) continue;
        working = { cal: working.cal-bp.contrib.cal, p: working.p-bp.contrib.p, c: working.c-bp.contrib.c, f: working.f-bp.contrib.f };
        const bc = bestPortion(C, { cal: working.cal, p: 0, c: working.c, f: 0 }, Math.max(working.cal, 0));
        if (!bc) continue;
        working = { cal: working.cal-bc.contrib.cal, p: working.p-bc.contrib.p, c: working.c-bc.contrib.c, f: working.f-bc.contrib.f };
        const bv = bestPortion(V, working, Math.max(working.cal + 40, 0));
        if (!bv) continue;
        const final = { cal: working.cal-bv.contrib.cal, p: working.p-bv.contrib.p, c: working.c-bv.contrib.c, f: working.f-bv.contrib.f };
        comboResults.push({
          sc: scoreLeft(final),
          parts: [
            { food: P, s: bp.s, contrib: bp.contrib },
            { food: C, s: bc.s, contrib: bc.contrib },
            { food: V, s: bv.s, contrib: bv.contrib },
          ],
        });
      }
      comboResults.sort((a,b) => a.sc - b.sc);
      // de-duplicate by protein+carb pair
      const seen = new Set();
      combos = [];
      for (const r of comboResults) {
        const key = r.parts[0].food.name + "|" + r.parts[1].food.name;
        if (seen.has(key)) continue;
        seen.add(key);
        const tot = r.parts.reduce((a,p)=>({cal:a.cal+p.contrib.cal,p:a.p+p.contrib.p,c:a.c+p.contrib.c,f:a.f+p.contrib.f}),{cal:0,p:0,c:0,f:0});
        combos.push({
          items: r.parts.map(p => ({ name: p.food.name, amt: fmtAmt(p.food, p.s), foodRef: p.food, amount: p.food.mode==="g"?Math.round(p.s*p.food.base):Math.round(p.s*p.food.base*4)/4 })),
          cal: r1(tot.cal), p: r1(tot.p), c: r1(tot.c), f: r1(tot.f),
        });
        if (combos.length >= 3) break;
      }
    }
    setSuggestions({ singles: topSingles, combos });
  };

  const applySuggestionItem = (it) => {
    setSel(it.foodRef);
    setQuery(it.foodRef.name);
    setAmount(String(it.amount));
  };

  const logWholeCombo = (sug) => {
    const entries = sug.items.map((it, idx) => {
      const f = it.foodRef;
      const ratio = it.amount / f.base;
      return {
        id: Date.now() + idx, meal,
        name: f.name, amount: it.amount,
        unit: f.mode === "g" ? "g" : f.unitLabel,
        cal: r1(f.cal*ratio), p: r1(f.p*ratio), c: r1(f.c*ratio), f: r1(f.f*ratio),
      };
    });
    updateLog({ ...log, [dayKey]: { ...dayData, entries: [...dayData.entries, ...entries] } });
    setSuggestions(null);
  };

  useEffect(() => saveLS("md-week", week), [week]);
  useEffect(() => saveLS("md-day", day), [day]);

  const dayKey = `w${week}-${day}`;
  const dayData = log[dayKey] || { dayType: "training", entries: [] };
  const target = TARGETS[dayData.dayType];

  const matches = useMemo(() => {
    if (!query.trim() || sel) return [];
    const q = query.toLowerCase();
    return foods.filter(f => f.name.toLowerCase().includes(q)).slice(0, 6);
  }, [query, foods, sel]);

  const totals = dayData.entries.reduce((a,e)=>({cal:a.cal+e.cal,p:a.p+e.p,c:a.c+e.c,f:a.f+e.f}),{cal:0,p:0,c:0,f:0});

  const updateLog = next => { setLog(next); saveLS("md-log", next); };

  const addEntry = () => {
    if (!sel || !amount) return;
    const amt = parseFloat(amount);
    if (isNaN(amt) || amt <= 0) return;
    const ratio = amt / sel.base;
    const entry = {
      id: Date.now(), meal, name: sel.name, amount: amt,
      unit: sel.mode === "g" ? "g" : sel.unitLabel,
      cal: r1(sel.cal*ratio), p: r1(sel.p*ratio), c: r1(sel.c*ratio), f: r1(sel.f*ratio),
    };
    updateLog({ ...log, [dayKey]: { ...dayData, entries: [...dayData.entries, entry] } });
    setQuery(""); setSel(null); setAmount("");
  };

  const removeEntry = id => updateLog({ ...log, [dayKey]: { ...dayData, entries: dayData.entries.filter(e=>e.id!==id) } });
  const setDayType = t => updateLog({ ...log, [dayKey]: { ...dayData, dayType: t } });

  const resetCounter = () => {
    if (!window.confirm("Reset all logged days and go back to Week 1, Mon? This can't be undone.")) return;
    updateLog({});
    setWeek(1);
    setDay("Mon");
  };

  const addNewFood = () => {
    if (!nf.name || !nf.cal) return;
    const food = {
      name: nf.name, mode: nf.mode,
      base: parseFloat(nf.base) || (nf.mode==="g"?100:1),
      unitLabel: nf.unitLabel,
      cal: parseFloat(nf.cal)||0, p: parseFloat(nf.p)||0, c: parseFloat(nf.c)||0, f: parseFloat(nf.f)||0,
      custom: true,
    };
    const all = [...foods, food];
    setFoods(all);
    saveLS("md-custom-foods", all.filter(f=>f.custom));
    setShowNew(false);
    setNf({ name:"", mode:"g", base:"100", unitLabel:"serving", cal:"", p:"", c:"", f:"" });
    setSel(food); setQuery(food.name);
  };

  const preview = sel && amount ? {
    cal: r1(sel.cal*parseFloat(amount||0)/sel.base),
    p: r1(sel.p*parseFloat(amount||0)/sel.base),
    c: r1(sel.c*parseFloat(amount||0)/sel.base),
    f: r1(sel.f*parseFloat(amount||0)/sel.base),
  } : null;

  return h("div", { className: "wrap" },
    h("div", { style: { display: "flex", justifyContent: "space-between", alignItems: "flex-start" } },
      h("div", null,
        h("div", { className: "eyebrow" }, "Cut Protocol · <10% Body Fat"),
        h("h1", null, "Macro Dashboard")),
      h("button", { className: "ghost-btn", onClick: resetCounter }, "Reset")),

    h("div", { className: "row nowrap" }, [1,2,3,4,5,6,7,8].map(w =>
      h("button", { key: w, className: "pill" + (week===w?" on":""), onClick: ()=>setWeek(w) }, "W"+w))),
    h("div", { className: "row" }, DAYS.map(d =>
      h("button", { key: d, className: "pill" + (day===d?" on":""), onClick: ()=>setDay(d) }, d))),
    h("div", { className: "row", style: { marginBottom: 20 } },
      h("button", { className: "pill" + (dayData.dayType==="training"?" on":""), onClick: ()=>setDayType("training") }, "Training · 2,150"),
      h("button", { className: "pill" + (dayData.dayType==="rest"?" on":""), onClick: ()=>setDayType("rest") }, "Rest · 1,900")),

    h("div", { className: "card" },
      h(Bar, { label: "Calories", val: totals.cal, max: target.cal, unit: "" }),
      h(Bar, { label: "Protein", val: totals.p, max: target.p, unit: "g" }),
      h(Bar, { label: "Carbs", val: totals.c, max: target.c, unit: "g" }),
      h(Bar, { label: "Fat", val: totals.f, max: target.f, unit: "g" }),
      h("button", { className: "ghost-btn", style: { width: "100%", marginTop: 4 }, onClick: suggestFillers }, "Suggest Gap Fillers"),
      suggestions && suggestions.singles.length === 0 && suggestions.combos.length === 0 && h("div", { style: { fontSize: 13, color: "var(--dim)", marginTop: 10, textAlign: "center" } }, "Under 50 cal remaining — day is essentially closed."),
      suggestions && suggestions.combos.length > 0 && h("div", { style: { marginTop: 12 } },
        h("div", { style: { fontSize: 11, color: "var(--dim)", textTransform: "uppercase", letterSpacing: ".08em", marginBottom: 6 } }, "Meal Combos · protein + carb + veg/fat · tap item to prefill, or log all"),
        suggestions.combos.map((s, i) =>
          h("div", { key: "c"+i, style: { border: "1px solid var(--border2)", borderRadius: 8, padding: "10px 12px", marginBottom: 8 } },
            s.items.map((it, j) =>
              h("div", { key: j, onClick: () => applySuggestionItem(it), style: { fontSize: 13, padding: "3px 0", cursor: "pointer" } },
                it.name + " ", h("span", { className: "amt" }, it.amt))),
            h("div", { style: { display: "flex", justifyContent: "space-between", alignItems: "center", marginTop: 6, paddingTop: 6, borderTop: "1px solid var(--border2)" } },
              h("span", { className: "num", style: { fontSize: 12, color: "var(--muted)" } }, `${s.cal} · ${s.p}P · ${s.c}C · ${s.f}F`),
              h("button", { className: "ghost-btn on", style: { padding: "4px 10px", fontSize: 12 }, onClick: () => logWholeCombo(s) }, "Log all"))))),
      suggestions && suggestions.singles.length > 0 && h("div", { style: { marginTop: 12 } },
        h("div", { style: { fontSize: 11, color: "var(--dim)", textTransform: "uppercase", letterSpacing: ".08em", marginBottom: 6 } }, "Single Fillers · tap to prefill"),
        suggestions.singles.map((s, i) =>
          h("div", { key: "s"+i, onClick: () => applySuggestionItem(s.items[0]), className: "entry", style: { cursor: "pointer" } },
            h("span", null, s.items[0].name + " ", h("span", { className: "amt" }, s.items[0].amt)),
            h("span", { className: "macros num" }, `${s.cal} · ${s.p}P · ${s.c}C · ${s.f}F`))))),

    h("div", { className: "card" },
      h("div", { className: "section-title" }, "Log Food"),
      h("div", { className: "rel mb10" },
        h("div", { className: "flex" },
          h("input", {
            placeholder: "Search foods (e.g. Fage, banana, walnuts)…",
            value: query,
            onChange: e => { setQuery(e.target.value); setSel(null); setUsdaResults([]); setUsdaError(""); }
          }),
          h("button", { className: "ghost-btn", style: { flex: "0 0 auto" }, onClick: searchUSDA, disabled: usdaLoading },
            usdaLoading ? "Searching…" : "Web ↗")),
        matches.length > 0 && h("div", { className: "dropdown" }, matches.map(m =>
          h("div", { key: m.name, onClick: () => { setSel(m); setQuery(m.name); } },
            m.name,
            h("span", null, `${m.cal} cal / ${m.base}${m.mode==="g"?"g":" "+m.unitLabel}`)))),
        usdaResults.length > 0 && h("div", { className: "dropdown" },
          h("div", { style: { fontSize: 11, color: "var(--dim)", textTransform: "uppercase", letterSpacing: ".08em", cursor: "default" } }, "Web Results · per 100g · saved to library on pick"),
          usdaResults.map((m, i) =>
            h("div", { key: i, onClick: () => pickUsda(m) },
              m.name,
              h("span", null, `${m.cal} cal · ${m.p}P · ${m.c}C · ${m.f}F · ${m.source}`)))),
        usdaError && h("div", { style: { fontSize: 12, color: "var(--orange)", marginTop: 6 } }, usdaError)),
      h("div", { className: "flex mb10" },
        h("input", {
          type: "number",
          placeholder: sel ? (sel.mode==="g" ? "Weight (g)" : `# of ${sel.unitLabel}s`) : "Amount",
          value: amount, onChange: e => setAmount(e.target.value)
        }),
        h("select", { value: meal, onChange: e => setMeal(e.target.value) },
          MEALS.map(m => h("option", { key: m }, m)))),
      preview && h("div", { className: "preview num" }, `→ ${preview.cal} cal · ${preview.p}P · ${preview.c}C · ${preview.f}F`),
      h("div", { className: "flex" },
        h("button", { className: "add-btn", disabled: !sel || !amount, onClick: addEntry }, `Add to ${meal}`),
        h("button", { className: "ghost-btn" + (showNew?" on":""), style: { flex: "0 0 auto" }, onClick: ()=>setShowNew(!showNew) }, "+ New Food")),
      showNew && h("div", { className: "mt" },
        h("input", { className: "mb8", placeholder: "Food name", value: nf.name, onChange: e=>setNf({...nf,name:e.target.value}), style:{marginBottom:8} }),
        h("div", { className: "flex mb8", style:{marginBottom:8} },
          h("select", { value: nf.mode, onChange: e=>setNf({...nf,mode:e.target.value}) },
            h("option", { value: "g" }, "By weight (g)"),
            h("option", { value: "unit" }, "By unit (tbsp, can, etc)")),
          h("input", { placeholder: nf.mode==="g"?"Base grams (e.g. 100)":"Base units (usually 1)", value: nf.base, onChange: e=>setNf({...nf,base:e.target.value}) })),
        nf.mode==="unit" && h("input", { placeholder: "Unit label (tbsp, can, pack…)", value: nf.unitLabel, onChange: e=>setNf({...nf,unitLabel:e.target.value}), style:{marginBottom:8} }),
        h("div", { className: "flex", style:{marginBottom:8} },
          h("input", { placeholder: "Cals", value: nf.cal, onChange: e=>setNf({...nf,cal:e.target.value}) }),
          h("input", { placeholder: "P (g)", value: nf.p, onChange: e=>setNf({...nf,p:e.target.value}) }),
          h("input", { placeholder: "C (g)", value: nf.c, onChange: e=>setNf({...nf,c:e.target.value}) }),
          h("input", { placeholder: "F (g)", value: nf.f, onChange: e=>setNf({...nf,f:e.target.value}) })),
        h("button", { className: "save-food-btn", onClick: addNewFood }, "Save Food to Library"))),

    MEALS.map(m => {
      const entries = dayData.entries.filter(e => e.meal === m);
      if (!entries.length) return null;
      const sub = entries.reduce((a,e)=>({cal:a.cal+e.cal,p:a.p+e.p,c:a.c+e.c,f:a.f+e.f}),{cal:0,p:0,c:0,f:0});
      return h("div", { key: m, className: "card", style: { padding: 16, marginBottom: 12 } },
        h("div", { className: "meal-head" },
          h("span", { className: "t" }, m),
          h("span", { className: "s num" }, `${r1(sub.cal)} cal · ${r1(sub.p)}P · ${r1(sub.c)}C · ${r1(sub.f)}F`)),
        entries.map(e => h("div", { key: e.id, className: "entry" },
          h("span", null, e.name + " ", h("span", { className: "amt" }, e.amount + (e.unit==="g"?"g":" "+e.unit))),
          h("span", { className: "macros num" },
            `${e.cal} · ${e.p}P · ${e.c}C · ${e.f}F`,
            h("button", { onClick: ()=>removeEntry(e.id) }, "×")))));
    }),

    dayData.entries.length === 0 && h("div", { className: "empty" }, `No foods logged for Week ${week}, ${day}. Search above to start.`)
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(h(App));
</script>
</body>
</html>
